name: Publish Docker release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    name: Backend and frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a stable semantic-version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          PYTHONPATH: .
        run: mkdir -p "$MPLCONFIGDIR" && python -m pytest backend/tests
      - name: Run frontend tests and build
        working-directory: frontend
        run: npm ci && npm test && npm run build

  docker-image:
    name: Publish multi-architecture Docker image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub Release
    needs: docker-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release notes with the Docker image reference
        uses: softprops/action-gh-release@v2
        with:
          name: Portfolio Analyser ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Multi-architecture Docker image (Linux/AMD64 and Linux/ARM64):

            `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`

            This image is also tagged `latest`. No native installer binaries are attached to this release.
